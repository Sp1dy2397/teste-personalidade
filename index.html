<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Discover Your Psychological Profile · The Aurelian Institute</title>
<meta name="description" content="A short, five-question reflective instrument. Runs entirely in your browser." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />

<style>
  /* ============================================================
     THEME TOKENS
     ============================================================ */
  :root {
    --bg:        #f2ece0;
    --panel:     #fbf7ee;
    --ink:       #241f19;
    --ink-soft:  #6a6053;
    --rule:      #d8cbb2;
    --accent:    #8a6a34;
    --accent-2:  #b99a5e;
    --wash:      rgba(160, 130, 70, 0.08);
    --field:     #fffdf8;
    --shadow:    0 22px 50px -20px rgba(70, 52, 20, 0.35);
    --scrim:     rgba(40, 32, 20, 0.55);
  }

  html[data-theme="dark"] {
    --bg:        #100f0d;
    --panel:     #1a1815;
    --ink:       #ece4d5;
    --ink-soft:  #a1957f;
    --rule:      #35302a;
    --accent:    #cbab63;
    --accent-2:  #8b7440;
    --wash:      rgba(203, 171, 99, 0.08);
    --field:     #131210;
    --shadow:    0 24px 60px -24px rgba(0, 0, 0, 0.9);
    --scrim:     rgba(0, 0, 0, 0.7);
  }

  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"]  { color-scheme: dark; }

  /* ============================================================
     BASE
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(1100px 520px at 50% -8%, var(--wash), transparent 62%),
      radial-gradient(800px 400px at 100% 100%, var(--wash), transparent 60%);
    background-attachment: fixed;
    font-family: "EB Garamond", Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color 0.5s ease, color 0.5s ease;
  }

  .shell {
    max-width: 780px;
    margin: 0 auto;
    padding: 54px 20px 72px;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  /* ============================================================
     MASTHEAD
     ============================================================ */
  .masthead { text-align: center; margin-bottom: 34px; }

  .crest {
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 0.6em;
    text-indent: 0.6em;
    opacity: 0.9;
  }

  .eyebrow {
    margin: 16px 0 10px;
    font-variant: small-caps;
    letter-spacing: 0.3em;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }

  h1 {
    margin: 0 0 14px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 5.4vw, 2.95rem);
    line-height: 1.12;
    letter-spacing: 0.005em;
  }

  .subtitle {
    margin: 0 auto;
    max-width: 44ch;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1.02rem;
  }

  /* ornamental rule */
  .rule {
    display: flex;
    align-items: center;
    gap: 14px;
    max-width: 320px;
    margin: 26px auto;
    color: var(--accent);
    font-size: 0.7rem;
    letter-spacing: 0.4em;
  }
  .rule::before,
  .rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--rule), transparent);
  }

  /* ============================================================
     CONTROLS
     ============================================================ */
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .control {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    padding: 9px 16px;
    cursor: pointer;
    transition: border-color 0.22s ease, color 0.22s ease, background-color 0.22s ease;
  }

  .control:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--wash);
  }

  select.control {
    padding-right: 36px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23a08a5e' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
  }

  #themeToggle { display: inline-flex; align-items: center; gap: 9px; }
  #themeIcon { font-size: 0.9rem; line-height: 1; }

  /* ============================================================
     CARD
     ============================================================ */
  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 50px 48px 44px;
    box-shadow: var(--shadow);
    transition: background-color 0.5s ease, border-color 0.5s ease;
  }

  .card::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid var(--rule);
    opacity: 0.45;
    pointer-events: none;
    border-radius: 1px;
  }

  .card > * { position: relative; z-index: 1; }

  /* ============================================================
     FORM
     ============================================================ */
  .section-title {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 24px;
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 500;
    font-variant: small-caps;
    letter-spacing: 0.24em;
    font-size: 0.78rem;
    color: var(--accent);
  }
  .section-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rule);
  }
  .section-title + * { margin-top: 0; }

  #questions { margin-top: 6px; }

  .field { margin-bottom: 22px; }

  .field > label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  input[type="text"],
  input[type="email"],
  input[type="date"] {
    width: 100%;
    padding: 12px 15px;
    background: var(--field);
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.5s ease;
  }

  input[type="text"]::placeholder,
  input[type="email"]::placeholder {
    color: var(--ink-soft);
    opacity: 0.55;
  }

  input[type="text"]:focus,
  input[type="email"]:focus,
  input[type="date"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--wash);
  }

  /* -------- questions -------- */
  .question {
    margin: 0 0 30px;
    padding: 0;
    border: 0;
  }

  .question legend {
    display: flex;
    gap: 12px;
    align-items: baseline;
    width: 100%;
    padding: 0;
    margin-bottom: 14px;
  }

  .qnum {
    flex: none;
    min-width: 1.5em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.06em;
  }

  .qtext { font-size: 1.03rem; }

  .options { display: grid; gap: 8px; }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 12px 16px;
    border: 1px solid var(--rule);
    border-radius: 2px;
    cursor: pointer;
    font-size: 0.97rem;
    color: var(--ink-soft);
    transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }

  .option:hover {
    border-color: var(--accent-2);
    background: var(--wash);
    color: var(--ink);
  }

  .option input[type="radio"] {
    flex: none;
    margin: 5px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .option:has(input:checked) {
    border-color: var(--accent);
    background: var(--wash);
    color: var(--ink);
  }

  /* -------- consent -------- */
  .consent {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    margin-top: 34px;
    padding: 18px 20px;
    border: 1px solid var(--rule);
    border-left: 3px solid var(--accent);
    border-radius: 2px;
    background: var(--wash);
    font-size: 0.95rem;   /* deliberately readable */
    line-height: 1.6;
    color: var(--ink-soft);
  }

  .consent input[type="checkbox"] {
    flex: none;
    margin: 5px 0 0;
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .consent label { cursor: pointer; }

  .consent a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }

  .consent a:hover { color: var(--ink); }

  .consent-note {
    margin: 9px 0 0;
    font-size: 0.86rem;
    font-style: italic;
    opacity: 0.85;
  }

  /* -------- button -------- */
  .btn-primary {
    display: block;
    width: 100%;
    margin-top: 26px;
    padding: 16px 22px;
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 2px;
    color: var(--panel);
    font-family: inherit;
    font-size: 0.76rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }

  .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fffdf8;
  }

  .btn-primary:active { transform: translateY(1px); }

  /* ============================================================
     RESULT
     ============================================================ */
  .result { display: none; }

  .result.show {
    display: block;
    animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .result-eyebrow {
    margin: 0;
    font-variant: small-caps;
    letter-spacing: 0.26em;
    font-size: 0.72rem;
    color: var(--accent);
  }

  .result-name {
    margin: 0.35em 0 0.55em;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: clamp(1.7rem, 4.4vw, 2.15rem);
    line-height: 1.15;
  }

  .result-desc {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1.02rem;
  }

  .scale {
    display: grid;
    gap: 13px;
    margin: 32px 0 28px;
    padding-top: 26px;
    border-top: 1px solid var(--rule);
  }

  .scale-row {
    display: grid;
    grid-template-columns: 118px 1fr 40px;
    align-items: center;
    gap: 14px;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .bar {
    position: relative;
    height: 6px;
    background: var(--rule);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar > span {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 99px;
    transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .pct { text-align: right; font-variant-numeric: tabular-nums; }

  .result-note {
    margin: 0 0 26px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-size: 0.86rem;
    font-style: italic;
    color: var(--ink-soft);
  }

  /* ============================================================
     FOOTER
     ============================================================ */
  .site-footer {
    margin-top: 38px;
    text-align: center;
    font-size: 0.74rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.85;
  }

  .site-footer .rule { max-width: 180px; margin: 0 auto 18px; }

  /* ============================================================
     MODAL
     ============================================================ */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    place-items: center;
    padding: 22px;
    background: var(--scrim);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .modal.open { display: grid; }

  .modal-box {
    width: min(600px, 100%);
    max-height: 82vh;
    overflow-y: auto;
    padding: 38px 38px 32px;
    background: var(--panel);
    border: 1px solid var(--rule);
    border-radius: 3px;
    box-shadow: var(--shadow);
    animation: rise 0.35s ease both;
  }

  .modal-box h3 {
    margin: 0 0 20px;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 1.55rem;
    letter-spacing: 0.01em;
  }

  .modal-box p {
    margin: 0 0 15px;
    font-size: 0.95rem;
    color: var(--ink-soft);
  }

  .modal-box .control { margin-top: 12px; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .shell { padding: 34px 14px 52px; }
    .card { padding: 34px 22px 30px; }
    .card::after { inset: 6px; }
    .scale-row { grid-template-columns: 88px 1fr 38px; gap: 10px; font-size: 0.64rem; }
    .modal-box { padding: 26px 22px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>

<body>
<div class="shell">

  <!-- ================= MASTHEAD ================= -->
  <header class="masthead">
    <div class="crest">✦</div>
    <p class="eyebrow" data-i18n="institute">The Aurelian Institute</p>
    <h1 data-i18n="title">Discover Your Psychological Profile</h1>
    <p class="subtitle" data-i18n="subtitle">A short reflective instrument in five questions.</p>

    <div class="rule"><span>❖</span></div>

    <div class="controls">
      <select id="lang" class="control" aria-label="Language">
        <option value="en">English</option>
        <option value="pt">Português</option>
        <option value="es">Español</option>
      </select>

      <button type="button" id="themeToggle" class="control" aria-label="Switch theme">
        <span id="themeIcon" aria-hidden="true">☾</span>
        <span id="themeLabel">Dark</span>
      </button>
    </div>
  </header>

  <!-- ================= CARD ================= -->
  <main class="card">

    <form id="quizForm" novalidate>

      <h2 class="section-title" data-i18n="sectionIdentity">I. Identification</h2>

      <div class="field">
        <label for="name" data-i18n="nameLabel">Full name</label>
        <input type="text" id="name" name="name" autocomplete="name"
               required data-i18n-ph="namePh" />
      </div>

      <div class="field">
        <label for="email" data-i18n="emailLabel">E-mail address</label>
        <input type="email" id="email" name="email" autocomplete="email"
               required data-i18n-ph="emailPh" />
      </div>

      <div class="field">
        <label for="dob" data-i18n="dobLabel">Date of birth</label>
        <input type="date" id="dob" name="dob" required />
      </div>

      <h2 class="section-title" style="margin-top:38px" data-i18n="sectionQuestions">II. Questionnaire</h2>

      <div id="questions"><!-- built by script --></div>

      <!-- ---------- CONSENT (fully visible, never pre-ticked) ---------- -->
      <div class="consent">
        <input type="checkbox" id="consent" required />
        <div class="consent-text">
          <label for="consent">
            <span data-i18n="consentPrefix">I have read and accept the</span>
            <a href="#" id="termsLink" data-i18n="termsLink">Terms of Use and Privacy Policy</a>.
          </label>
          <p class="consent-note" data-i18n="consentNote"></p>
        </div>
      </div>

      <button type="submit" class="btn-primary" data-i18n="submit">See my result</button>
    </form>

    <!-- ---------- RESULT ---------- -->
    <section class="result" id="result" role="status" aria-live="polite">
      <p class="result-eyebrow" id="resultFor"></p>
      <h2 class="result-name" id="resultName"></h2>
      <p class="result-desc" id="resultDesc"></p>

      <div class="scale" id="resultScale"></div>

      <p class="result-note" id="resultNote"></p>

      <button type="button" class="btn-primary" id="restartBtn"></button>
    </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="site-footer">
    <div class="rule"><span>✦</span></div>
    <p data-i18n="footer"></p>
  </footer>
</div>

<!-- ================= TERMS MODAL ================= -->
<div class="modal" id="termsModal">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="termsTitle">
    <h3 id="termsTitle"></h3>
    <div id="termsBody"></div>
    <button type="button" class="control" id="termsClose"></button>
  </div>
</div>

      termsTitle: "Términos de Uso y Política de Privacidad",
      termsBody: [
        "Este instrumento es una demostración educativa. Existe para mostrar cómo un cuestionario breve puede presentarse de forma clara, honesta y accesible en la web abierta.",
        "Los datos que introduce —nombre, correo electrónico, fecha de nacimiento y respuestas— se procesan íntegramente en su propio navegador. No se transmiten, almacenan, venden, comparten ni utilizan para elaborar perfiles. Nada sale de su dispositivo.",

        "Su consentimiento es obligatorio antes de mostrar cualquier resultado, y la casilla nunca viene premarcada. Puede borrar todo lo introducido en cualquier momento con el botón «Empezar de nuevo».",

      ],

  const TOTAL_QUESTIONS = 5;
  const PROFILE_KEYS = ["social", "analytical", "reflective"];

  /* ============================================================
     2. STATE + HELPERS
     ============================================================ */
  const state = {
    lang: "en",
    theme: "light",
    result: null          // { name, counts: [n,n,n] }
  };

  const $  = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.prototype.slice.call((root || document).querySelectorAll(sel));

  function store(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* private mode */ }
  }
  function read(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }

  /* ============================================================
     3. BUILD THE QUESTIONNAIRE (once — keeps answers on language switch)
     ============================================================ */
  function buildQuestions() {
    const wrap = $("#questions");
    wrap.innerHTML = "";

    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
      const fieldset = document.createElement("fieldset");
      fieldset.className = "question";

      const legend = document.createElement("legend");

      const num = document.createElement("span");
      num.className = "qnum";
      num.textContent = String(i + 1).padStart(2, "0");

      const qtext = document.createElement("span");
      qtext.className = "qtext";
      qtext.setAttribute("data-qtext", String(i));

      legend.appendChild(num);
      legend.appendChild(qtext);
      fieldset.appendChild(legend);

      const options = document.createElement("div");
      options.className = "options";

      for (let j = 0; j < 3; j++) {
        const label = document.createElement("label");
        label.className = "option";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = "q" + i;
        input.value = String(j);
        if (j === 0) input.required = true;   // one required per group

        const text = document.createElement("span");
        text.className = "opt-text";
        text.setAttribute("data-opttext", i + "-" + j);

        label.appendChild(input);
        label.appendChild(text);
        options.appendChild(label);
      }

      fieldset.appendChild(options);
      wrap.appendChild(fieldset);
    }
  }

  /* ============================================================
     4. LANGUAGE
     ============================================================ */
  function detectLanguage() {
    const saved = read("aurelian-lang");
    if (saved && I18N[saved]) return saved;

    const nav = (navigator.language || "en").toLowerCase();
    if (nav.indexOf("pt") === 0) return "pt";
    if (nav.indexOf("es") === 0) return "es";
    return "en";
  }

  function applyLanguage(code) {
    const t = I18N[code];
    if (!t) return;

    state.lang = code;
    document.documentElement.setAttribute("lang", code);

    $$("[data-i18n]").forEach(function (el) {
      const key = el.getAttribute("data-i18n");
      if (typeof t[key] === "string") el.textContent = t[key];
    });

    $$("[data-i18n-ph]").forEach(function (el) {
      const key = el.getAttribute("data-i18n-ph");
      if (typeof t[key] === "string") el.setAttribute("placeholder", t[key]);
    });

    $$("[data-qtext]").forEach(function (el) {
      const i = Number(el.getAttribute("data-qtext"));
      el.textContent = t.questions[i].t;
    });

    $$("[data-opttext]").forEach(function (el) {
      const parts = el.getAttribute("data-opttext").split("-");
      el.textContent = t.questions[Number(parts[0])].o[Number(parts[1])];
    });

    renderTerms(t);
    updateThemeLabel();
    renderResult();

    $("#lang").value = code;
    store("aurelian-lang", code);
  }

  /* ============================================================
     5. THEME
     ============================================================ */
  function updateThemeLabel() {
    const t = I18N[state.lang];
    $("#themeIcon").textContent = state.theme === "dark" ? "☀" : "☾";
    $("#themeLabel").textContent = state.theme === "dark" ? t.themeLight : t.themeDark;
  }

  function setTheme(theme, persist) {
    state.theme = theme;
    document.documentElement.setAttribute("data-theme", theme);
    updateThemeLabel();
    if (persist) store("aurelian-theme", theme);
  }

  function detectTheme() {
    const saved = read("aurelian-theme");
    if (saved === "dark" || saved === "light") return saved;
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }

  /* ============================================================
     6. TERMS MODAL
     ============================================================ */
  function renderTerms(t) {
    $("#termsTitle").textContent = t.termsTitle;
    $("#termsClose").textContent = t.close;

    const body = $("#termsBody");
    body.innerHTML = "";
    t.termsBody.forEach(function (paragraph) {
      const p = document.createElement("p");
      p.textContent = paragraph;
      body.appendChild(p);
    });
  }

  function openTerms() {
    $("#termsModal").classList.add("open");
    $("#termsClose").focus();
  }
  function closeTerms() {
    $("#termsModal").classList.remove("open");
  }

  /* ============================================================
     7. SCORING + RESULT
     ============================================================ */
  function computeResult() {
    const counts = [0, 0, 0];

    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
      const checked = document.querySelector('input[name="q' + i + '"]:checked');
      if (checked) counts[Number(checked.value)]++;
    }

    const max = Math.max(counts[0], counts[1], counts[2]);
    const leaders = counts
      .map(function (c, i) { return c === max ? i : -1; })
      .filter(function (i) { return i !== -1; });

    // A tie at the top → balanced profile
    const key = leaders.length > 1 ? "balanced" : PROFILE_KEYS[leaders[0]];

    return { counts: counts, key: key };
  }

  function renderResult() {
    const r = state.result;
    if (!r) return;

    const t = I18N[state.lang];
    const profile = t.profiles[r.key];
    const labels = [t.dimSocial, t.dimAnalytical, t.dimReflective];
    const total = r.counts.reduce(function (a, b) { return a + b; }, 0) || 1;

    $("#resultFor").textContent = t.resultFor.replace("{name}", r.name);
    $("#resultName").textContent = profile.name;
    $("#resultDesc").textContent = profile.desc;
    $("#resultNote").textContent = t.disclaimer;
    $("#restartBtn").textContent = t.reset;

    const scale = $("#resultScale");
    scale.innerHTML = "";

    r.counts.forEach(function (count, i) {
      const pct = Math.round((count / total) * 100);

      const row = document.createElement("div");
      row.className = "scale-row";

      const label = document.createElement("span");
      label.textContent = labels[i];

      const bar = document.createElement("span");
      bar.className = "bar";
      const fill = document.createElement("span");
      bar.appendChild(fill);

      const value = document.createElement("span");
      value.className = "pct";
      value.textContent = pct + "%";

      row.appendChild(label);
      row.appendChild(bar);
      row.appendChild(value);
      scale.appendChild(row);

      // animate after paint
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { fill.style.width = pct + "%"; });
      });
    });
  }

  function showResult() {
    const t = I18N[state.lang];
    const data = computeResult();

    state.result = {
      name: $("#name").value.trim() || "—",
      counts: data.counts,
      key: data.key
    };

    $("#quizForm").hidden = true;

    const panel = $("#result");
    panel.classList.add("show");
    renderResult();

    panel.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function resetTest() {
    state.result = null;

    const form = $("#quizForm");
    form.reset();
    form.hidden = false;

    $("#result").classList.remove("show");
    $("#resultScale").innerHTML = "";

    $("#name").focus();
    form.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ============================================================
     8. EVENTS
     ============================================================ */
  function bindEvents() {
    // Language
    $("#lang").addEventListener("change", function (e) {
      applyLanguage(e.target.value);
    });

    // Theme
    $("#themeToggle").addEventListener("click", function () {
      setTheme(state.theme === "dark" ? "light" : "dark", true);
    });

    // Terms modal (stop the label from toggling the checkbox)
    $("#termsLink").addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      openTerms();
    });

    $("#termsClose").addEventListener("click", closeTerms);

    $("#termsModal").addEventListener("click", function (e) {
      if (e.target === this) closeTerms();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") closeTerms();
    });

    // Submit
    $("#quizForm").addEventListener("submit", function (e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        this.reportValidity();
        return;
      }
      showResult();
    });

    // Restart
    $("#restartBtn").addEventListener("click", resetTest);
  }

  /* ============================================================
     9. INIT
     ============================================================ */
  function init() {
    buildQuestions();

    state.lang = detectLanguage();
    setTheme(detectTheme(), false);
    applyLanguage(state.lang);

    bindEvents();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
